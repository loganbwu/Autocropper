<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocropper Review</title>
  <style>
    :root {
      --white: #fff;
      --grey: grey;
      --paragraph-text-color: #bbb;
      --pale-blue: #ADD8E6;
      --black: #111111;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--black);
      color: var(--paragraph-text-color);
      font-family: Helvetica, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Folder picker screen ── */

    #screen-picker {
      position: fixed;
      inset: 0;
      background: var(--black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 200;
    }

    #screen-picker.hidden { display: none; }

    #picker-title {
      font-size: 28px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--white);
    }

    #picker-sub {
      font-size: 14px;
      color: var(--grey);
    }

    #btn-pick {
      background: transparent;
      border: 1px solid var(--pale-blue);
      color: var(--pale-blue);
      padding: 10px 28px;
      font-family: Helvetica, sans-serif;
      font-size: 14px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.15s;
    }

    #btn-pick:hover:not(:disabled) { background: rgba(173, 216, 230, 0.08); }
    #btn-pick:disabled { opacity: 0.4; cursor: not-allowed; }

    #picker-error {
      font-size: 13px;
      color: #e88;
      min-height: 18px;
    }


    /* ── Review header ── */

    #header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    #filename { font-weight: 600; color: var(--white); }
    #progress { color: var(--grey); }

    #buffer-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #buffer-indicator {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    #review-prefetch, #review-margin {
      width: 46px;
      background: transparent;
      border: 1px solid #444;
      border-radius: 3px;
      color: var(--paragraph-text-color);
      font-family: Helvetica, sans-serif;
      font-size: 12px;
      padding: 2px 6px;
      text-align: center;
    }

    #review-prefetch:focus, #review-margin:focus { outline: none; border-color: var(--pale-blue); color: var(--white); }

    #margin-control {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--grey);
    }

    #margin-control.ml-active {
      opacity: 0.35;
      pointer-events: none;
    }

    #ml-control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--grey);
    }

    #ml-label { cursor: pointer; user-select: none; }

    #ml-toggle {
      width: 32px;
      height: 17px;
      border-radius: 9px;
      background: #444;
      position: relative;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    #ml-toggle::after {
      content: '';
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #bbb;
      top: 2px;
      left: 2px;
      transition: left 0.2s, background 0.2s;
    }

    #ml-toggle.on { background: var(--pale-blue); }
    #ml-toggle.on::after { left: 17px; background: var(--white); }

    #ml-toggle:disabled { opacity: 0.35; cursor: default; }

    #ml-file-label {
      font-size: 11px;
      padding: 2px 7px;
      border: 1px solid #444;
      border-radius: 3px;
      cursor: pointer;
      color: var(--grey);
      white-space: nowrap;
    }

    #ml-file-label:hover { border-color: var(--pale-blue); color: var(--pale-blue); }

    #ml-file { display: none; }

    #ml-status {
      font-size: 11px;
      color: var(--grey);
      white-space: nowrap;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #ml-badge {
      display: none;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--pale-blue);
      color: var(--black);
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .buf-dot {
      width: 6px;
      height: 6px;
      border-radius: 1px;
      background: #333;
      transition: background 0.3s;
    }

    .buf-dot.ready { background: var(--pale-blue); }

    #progress-bar-wrap {
      flex: 0 0 auto;
      height: 3px;
      background: #333;
    }
    #progress-bar {
      height: 100%;
      background: var(--pale-blue);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ── Image panels ── */

    #panels {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }

    .panel {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.1s;
    }

    .panel:first-child { border-right: 1px solid #333; }

    .panel:hover { background: #1a1a1a; }

    .panel.selected {
      background: #161e20;
      outline: 2px solid var(--pale-blue);
      outline-offset: -2px;
    }

    .panel img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .panel-label {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: var(--white);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      white-space: nowrap;
    }

    .key-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--paragraph-text-color);
      pointer-events: none;
    }

    .key-badge {
      display: inline-block;
      background: #444;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--white);
    }

    /* ── Loading / done overlay ── */

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(17,17,17,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }

    #overlay.hidden { display: none; }

    #overlay-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--white);
    }

    #overlay-sub {
      font-size: 15px;
      color: var(--grey);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #333;
      border-top-color: var(--pale-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #overlay-progress-wrap {
      width: 260px;
      height: 3px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
    }

    #overlay-progress-bar {
      height: 100%;
      background: var(--pale-blue);
      width: 0%;
      transition: width 0.25s ease;
    }

    #stats {
      font-size: 14px;
      color: var(--paragraph-text-color);
      text-align: center;
      line-height: 1.8;
    }

    #stats span { color: var(--white); font-weight: 600; }

    .btn-secondary {
      background: transparent;
      border: 1px solid #555;
      color: var(--paragraph-text-color);
      padding: 8px 22px;
      font-family: Helvetica, sans-serif;
      font-size: 13px;
      cursor: pointer;
      border-radius: 3px;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-secondary:hover {
      border-color: var(--pale-blue);
      color: var(--pale-blue);
    }
  </style>
</head>
<body>

<!-- Folder picker screen -->
<div id="screen-picker">
  <div id="picker-title">Autocropper</div>
  <div id="picker-sub">Select a folder of CR3 files to review</div>
  <button id="btn-pick" onclick="pickFolder()">Select Folder</button>
  <div id="picker-error"></div>
</div>

<!-- Review UI -->
<div id="header">
  <div id="filename"></div>
  <div id="buffer-control">
    <div id="buffer-indicator"></div>
    <input id="review-prefetch" type="number" min="{{ prefetch_min }}" max="{{ prefetch_max }}"
           value="{{ prefetch_default }}" title="Buffer size" oninput="setPrefetch(this.value)">
  </div>
  <div id="margin-control">
    margin
    <input id="review-margin" type="number" min="{{ margin_min }}" max="{{ margin_max }}"
           value="{{ margin_default }}" title="Crop margin %" oninput="setMargin(this.value)">
    %
  </div>
  <div id="ml-control">
    <label id="ml-file-label" for="ml-file" title="Upload training dataset (.pkl)">dataset</label>
    <input id="ml-file" type="file" accept=".pkl" onchange="uploadDataset(this)">
    <span id="ml-status"></span>
    <button id="ml-toggle" title="Enable ML crop mode" onclick="toggleMlMode()" disabled></button>
    <label id="ml-label" for="ml-toggle" onclick="toggleMlMode()">ML</label>
  </div>
  <span id="ml-badge">ML</span>
  <div id="progress"></div>
</div>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<div id="panels">
  <div class="panel" id="panel-orig" onclick="decide('skip')">
    <img id="img-orig" src="" alt="">
    <div class="key-hint"><span class="key-badge">1</span> Keep original</div>
  </div>
  <div class="panel" id="panel-crop" onclick="decide('crop')">
    <img id="img-crop" src="" alt="">
    <div class="key-hint"><span class="key-badge">2</span> Apply crop</div>
  </div>
</div>

<div id="overlay">
  <div class="spinner"></div>
  <div id="overlay-title">Loading...</div>
  <div id="overlay-sub"></div>
  <div id="overlay-progress-wrap" style="display:none">
    <div id="overlay-progress-bar"></div>
  </div>
</div>

<script>
  const INITIAL_PATH = {{ initial_path | tojson }};

  let uiReady = false;
  let deciding = false;
  let currentPrefetch = 0;  // rebuilt from first state response
  let _pollTimer = null;

  function schedulePoll(delay) {
    clearTimeout(_pollTimer);
    _pollTimer = setTimeout(poll, delay);
  }

  // ── Folder picker ──────────────────────────────────────────

  async function pickFolder() {
    document.getElementById('btn-pick').disabled = true;
    document.getElementById('picker-error').textContent = '';

    const res = await fetch('/api/pick-folder');
    const data = await res.json();

    if (!data.path) {
      // User cancelled the dialog
      document.getElementById('btn-pick').disabled = false;
      return;
    }

    await startWithPath(data.path);
  }

  async function startWithPath(path) {
    document.getElementById('btn-pick').disabled = true;
    document.getElementById('picker-sub').textContent = 'Loading...';
    document.getElementById('picker-error').textContent = '';

    await fetch('/api/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path}),
    });

    document.getElementById('screen-picker').classList.add('hidden');
    poll();
  }

  function showPicker() {
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('screen-picker').classList.remove('hidden');
    document.getElementById('btn-pick').disabled = false;
    document.getElementById('picker-sub').textContent = 'Select a folder of CR3 files to review';
    document.getElementById('picker-error').textContent = '';
    uiReady = false;
    deciding = false;
  }

  // ── Review polling ─────────────────────────────────────────

  async function poll() {
    try {
      const res = await fetch('/api/state');
      const data = await res.json();

      if (data.status === 'error') {
        showPicker();
        document.getElementById('picker-error').textContent = data.message;
        return;
      }

      if (data.status === 'starting') {
        showStarting(data.stage, data.progress);
        schedulePoll(data.progress != null ? 250 : 600);
        return;
      }

      if (data.status === 'done') {
        showDone(data);
        return;
      }

      if (data.status === 'loading') {
        showLoading(data);
        schedulePoll(600);
        return;
      }

      // ready
      showImage(data);
      schedulePoll(2000);
    } catch (e) {
      schedulePoll(1000);
    }
  }

  function showStarting(stage, progress) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    overlay.querySelector('.spinner').style.display = '';
    document.getElementById('overlay-title').textContent = 'Starting...';
    document.getElementById('overlay-sub').textContent = stage || '';
    const wrap = document.getElementById('overlay-progress-wrap');
    const bar  = document.getElementById('overlay-progress-bar');
    if (progress != null) {
      wrap.style.display = '';
      bar.style.width = (progress * 100).toFixed(1) + '%';
    } else {
      wrap.style.display = 'none';
      bar.style.width = '0%';
    }
    uiReady = false;
    deciding = false;
  }

  function updateBuffer(buffered, total) {
    if (total !== undefined && total !== currentPrefetch) {
      currentPrefetch = total;
      const indicator = document.getElementById('buffer-indicator');
      indicator.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('div');
        dot.className = 'buf-dot';
        indicator.appendChild(dot);
      }
      // Keep header input in sync with server-reported prefetch
      const inp = document.getElementById('review-prefetch');
      if (inp && inp !== document.activeElement) inp.value = total;
    }
    document.querySelectorAll('.buf-dot').forEach((dot, i) => {
      dot.classList.toggle('ready', i < buffered);
    });
  }

  let _prefetchTimer = null;
  function setPrefetch(val) {
    clearTimeout(_prefetchTimer);
    _prefetchTimer = setTimeout(async () => {
      let n = parseInt(val);
      if (!n || isNaN(n)) return;
      n = Math.max({{ prefetch_min }}, Math.min({{ prefetch_max }}, n));
      // Snap the input to the clamped value so it always matches the dots
      const inp = document.getElementById('review-prefetch');
      if (inp) inp.value = n;
      await fetch('/api/set-prefetch', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prefetch: n}),
      });
    }, 400);
  }

  let _marginTimer = null;
  function setMargin(val) {
    clearTimeout(_marginTimer);
    _marginTimer = setTimeout(async () => {
      let pct = parseFloat(val);
      if (isNaN(pct)) return;
      pct = Math.max({{ margin_min }}, Math.min({{ margin_max }}, pct));
      const inp = document.getElementById('review-margin');
      if (inp) inp.value = pct;
      const res = await fetch('/api/set-margin', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({margin: pct}),
      });
      const data = await res.json();
      if (data.crop_b64) {
        document.getElementById('img-crop').src = 'data:image/jpeg;base64,' + data.crop_b64;
      }
    }, 400);
  }

  function showLoading(data) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    document.getElementById('overlay-title').textContent = 'Processing...';
    const analysed = data.producer_idx != null ? data.producer_idx : data.idx;
    const sub = data.total > 0
      ? `Analysing ${analysed} of ${data.total}`
      : 'Analysing images';
    document.getElementById('overlay-sub').textContent = sub;
    overlay.querySelector('.spinner').style.display = '';
    updateBuffer(data.buffered || 0, data.prefetch);
    uiReady = false;
    deciding = false;
  }

  function showImage(data) {
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('img-orig').src = 'data:image/jpeg;base64,' + data.orig_b64;
    document.getElementById('img-crop').src = 'data:image/jpeg;base64,' + data.crop_b64;
    document.getElementById('filename').textContent = data.filename;
    document.getElementById('progress').textContent = `${data.idx} / ${data.total}`;
    const pct = data.total > 0 ? ((data.idx - 1) / data.total * 100) : 0;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('panel-orig').classList.remove('selected');
    document.getElementById('panel-crop').classList.remove('selected');
    updateBuffer(data.buffered || 0, data.prefetch);
    // Show ML badge on crop panel when result came from ML mode
    document.getElementById('ml-badge').style.display = data.ml_crop ? '' : 'none';
    // Sync toggle state with server
    syncMlUi(data);
    uiReady = true;
    deciding = false;
  }

  // ── ML crop controls ────────────────────────────────────────

  let _mlMode = false;
  let _mlDatasetLoaded = false;
  let _mlModelsReady = false;

  function syncMlUi(data) {
    _mlMode = !!data.ml_mode;
    _mlDatasetLoaded = !!data.ml_dataset_loaded;
    _mlModelsReady = !!data.ml_models_ready;

    const toggle = document.getElementById('ml-toggle');
    const marginCtrl = document.getElementById('margin-control');

    toggle.disabled = !(_mlDatasetLoaded && _mlModelsReady);
    toggle.classList.toggle('on', _mlMode);
    marginCtrl.classList.toggle('ml-active', _mlMode);

    if (_mlDatasetLoaded && !_mlModelsReady) {
      document.getElementById('ml-status').textContent = 'loading models...';
    } else if (!_mlDatasetLoaded) {
      document.getElementById('ml-status').textContent = '';
    }
  }

  async function uploadDataset(input) {
    const file = input.files[0];
    if (!file) return;
    const status = document.getElementById('ml-status');
    status.textContent = 'uploading...';
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/ml-dataset', { method: 'POST', body: form });
      const data = await res.json();
      if (data.error) {
        status.textContent = data.error;
      } else {
        status.textContent = `${data.records} records`;
        _mlDatasetLoaded = true;
        _mlModelsReady = data.ml_models_ready || false;
        const toggle = document.getElementById('ml-toggle');
        toggle.disabled = !_mlModelsReady;
        if (!_mlModelsReady) {
          status.textContent = `${data.records} records — loading models...`;
          // Poll until ML models ready
          const pollModels = setInterval(async () => {
            const r = await fetch('/api/state');
            const d = await r.json();
            if (d.ml_models_ready) {
              clearInterval(pollModels);
              status.textContent = `${data.records} records`;
              toggle.disabled = false;
            }
          }, 2000);
        }
      }
    } catch (e) {
      status.textContent = 'upload failed';
    }
    input.value = '';
  }

  async function toggleMlMode() {
    if (!_mlDatasetLoaded || !_mlModelsReady) return;
    const newMode = !_mlMode;
    try {
      const res = await fetch('/api/ml-mode', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled: newMode}),
      });
      const data = await res.json();
      if (!data.error) {
        _mlMode = newMode;
        document.getElementById('ml-toggle').classList.toggle('on', _mlMode);
        document.getElementById('margin-control').classList.toggle('ml-active', _mlMode);
      }
    } catch (e) { /* ignore */ }
  }

  function showDone(data) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    overlay.querySelector('.spinner').style.display = 'none';
    document.getElementById('overlay-title').textContent = 'All done';
    document.getElementById('overlay-sub').textContent = '';
    document.getElementById('progress-bar').style.width = '100%';
    uiReady = false;

    // Clear any previous stats/button
    overlay.querySelectorAll('#stats, .btn-secondary').forEach(el => el.remove());

    const stats = document.createElement('div');
    stats.id = 'stats';
    stats.innerHTML = `
      <div>Crops applied: <span>${data.accepted}</span></div>
      <div>Skipped: <span>${data.rejected}</span></div>
      <div>Already reviewed / no person: <span>${data.skipped}</span></div>
    `;
    overlay.appendChild(stats);

    const btn = document.createElement('button');
    btn.textContent = 'Process another folder';
    btn.className = 'btn-secondary';
    btn.onclick = showPicker;
    overlay.appendChild(btn);
  }

  async function decide(choice) {
    if (!uiReady || deciding) return;
    deciding = true;

    document.getElementById('panel-orig').classList.toggle('selected', choice === 'skip');
    document.getElementById('panel-crop').classList.toggle('selected', choice === 'crop');

    await fetch('/api/decide', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({choice}),
    });

    uiReady = false;
    schedulePoll(100);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === '1') decide('skip');
    if (e.key === '2') decide('crop');
  });

  // ── Entry point ────────────────────────────────────────────

  if (INITIAL_PATH) {
    document.getElementById('screen-picker').classList.add('hidden');
    startWithPath(INITIAL_PATH);
  }
  // Otherwise the picker screen is visible and waiting for user interaction
</script>
</body>
</html>
