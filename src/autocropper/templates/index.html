<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocropper Review</title>
  <style>
    :root {
      --white: #fff;
      --grey: grey;
      --paragraph-text-color: #bbb;
      --pale-blue: #ADD8E6;
      --black: #111111;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--black);
      color: var(--paragraph-text-color);
      font-family: Helvetica, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Folder picker screen ── */

    #screen-picker {
      position: fixed;
      inset: 0;
      background: var(--black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 200;
    }

    #screen-picker.hidden { display: none; }

    #picker-title {
      font-size: 28px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--white);
    }

    #picker-sub {
      font-size: 14px;
      color: var(--grey);
    }

    #btn-pick {
      background: transparent;
      border: 1px solid var(--pale-blue);
      color: var(--pale-blue);
      padding: 10px 28px;
      font-family: Helvetica, sans-serif;
      font-size: 14px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.15s;
    }

    #btn-pick:hover:not(:disabled) { background: rgba(173, 216, 230, 0.08); }
    #btn-pick:disabled { opacity: 0.4; cursor: not-allowed; }

    #picker-error {
      font-size: 13px;
      color: #e88;
      min-height: 18px;
    }


    /* ── Review header ── */

    #header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    #filename { font-weight: 600; color: var(--white); }
    #progress { color: var(--grey); }

    #buffer-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #buffer-indicator {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    #review-prefetch {
      width: 46px;
      background: transparent;
      border: 1px solid #444;
      border-radius: 3px;
      color: var(--paragraph-text-color);
      font-family: Helvetica, sans-serif;
      font-size: 12px;
      padding: 2px 6px;
      text-align: center;
    }

    #review-prefetch:focus { outline: none; border-color: var(--pale-blue); color: var(--white); }

    .buf-dot {
      width: 6px;
      height: 6px;
      border-radius: 1px;
      background: #333;
      transition: background 0.3s;
    }

    .buf-dot.ready { background: var(--pale-blue); }

    #progress-bar-wrap {
      flex: 0 0 auto;
      height: 3px;
      background: #333;
    }
    #progress-bar {
      height: 100%;
      background: var(--pale-blue);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ── Image panels ── */

    #panels {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }

    .panel {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.1s;
    }

    .panel:first-child { border-right: 1px solid #333; }

    .panel:hover { background: #1a1a1a; }

    .panel.selected {
      background: #161e20;
      outline: 2px solid var(--pale-blue);
      outline-offset: -2px;
    }

    .panel img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .panel-label {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: var(--white);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      white-space: nowrap;
    }

    .key-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--paragraph-text-color);
      pointer-events: none;
    }

    .key-badge {
      display: inline-block;
      background: #444;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--white);
    }

    /* ── Loading / done overlay ── */

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(17,17,17,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }

    #overlay.hidden { display: none; }

    #overlay-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--white);
    }

    #overlay-sub {
      font-size: 15px;
      color: var(--grey);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #333;
      border-top-color: var(--pale-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #stats {
      font-size: 14px;
      color: var(--paragraph-text-color);
      text-align: center;
      line-height: 1.8;
    }

    #stats span { color: var(--white); font-weight: 600; }

    .btn-secondary {
      background: transparent;
      border: 1px solid #555;
      color: var(--paragraph-text-color);
      padding: 8px 22px;
      font-family: Helvetica, sans-serif;
      font-size: 13px;
      cursor: pointer;
      border-radius: 3px;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-secondary:hover {
      border-color: var(--pale-blue);
      color: var(--pale-blue);
    }
  </style>
</head>
<body>

<!-- Folder picker screen -->
<div id="screen-picker">
  <div id="picker-title">Autocropper</div>
  <div id="picker-sub">Select a folder of CR3 files to review</div>
  <button id="btn-pick" onclick="pickFolder()">Select Folder</button>
  <div id="picker-error"></div>
</div>

<!-- Review UI -->
<div id="header">
  <div id="filename"></div>
  <div id="buffer-control">
    <div id="buffer-indicator"></div>
    <input id="review-prefetch" type="number" min="{{ prefetch_min }}" max="{{ prefetch_max }}"
           value="{{ prefetch_default }}" title="Buffer size" oninput="setPrefetch(this.value)">
  </div>
  <div id="progress"></div>
</div>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<div id="panels">
  <div class="panel" id="panel-orig" onclick="decide('skip')">
    <img id="img-orig" src="" alt="">
    <div class="key-hint"><span class="key-badge">1</span> Keep original</div>
  </div>
  <div class="panel" id="panel-crop" onclick="decide('crop')">
    <img id="img-crop" src="" alt="">
    <div class="key-hint"><span class="key-badge">2</span> Apply crop</div>
  </div>
</div>

<div id="overlay">
  <div class="spinner"></div>
  <div id="overlay-title">Loading...</div>
  <div id="overlay-sub"></div>
</div>

<script>
  const INITIAL_PATH = {{ initial_path | tojson }};

  let uiReady = false;
  let deciding = false;
  let currentPrefetch = 0;  // rebuilt from first state response

  // ── Folder picker ──────────────────────────────────────────

  async function pickFolder() {
    document.getElementById('btn-pick').disabled = true;
    document.getElementById('picker-error').textContent = '';

    const res = await fetch('/api/pick-folder');
    const data = await res.json();

    if (!data.path) {
      // User cancelled the dialog
      document.getElementById('btn-pick').disabled = false;
      return;
    }

    await startWithPath(data.path);
  }

  async function startWithPath(path) {
    document.getElementById('btn-pick').disabled = true;
    document.getElementById('picker-sub').textContent = 'Loading...';
    document.getElementById('picker-error').textContent = '';

    await fetch('/api/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path}),
    });

    document.getElementById('screen-picker').classList.add('hidden');
    poll();
  }

  function showPicker() {
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('screen-picker').classList.remove('hidden');
    document.getElementById('btn-pick').disabled = false;
    document.getElementById('picker-sub').textContent = 'Select a folder of CR3 files to review';
    document.getElementById('picker-error').textContent = '';
    uiReady = false;
    deciding = false;
  }

  // ── Review polling ─────────────────────────────────────────

  async function poll() {
    try {
      const res = await fetch('/api/state');
      const data = await res.json();

      if (data.status === 'error') {
        showPicker();
        document.getElementById('picker-error').textContent = data.message;
        return;
      }

      if (data.status === 'starting') {
        showStarting(data.stage);
        setTimeout(poll, 600);
        return;
      }

      if (data.status === 'done') {
        showDone(data);
        return;
      }

      if (data.status === 'loading') {
        showLoading(data);
        setTimeout(poll, 600);
        return;
      }

      // ready
      showImage(data);
      setTimeout(poll, 2000);
    } catch (e) {
      setTimeout(poll, 1000);
    }
  }

  function showStarting(stage) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    overlay.querySelector('.spinner').style.display = '';
    document.getElementById('overlay-title').textContent = 'Starting...';
    document.getElementById('overlay-sub').textContent = stage || '';
    uiReady = false;
    deciding = false;
  }

  function updateBuffer(buffered, total) {
    if (total !== undefined && total !== currentPrefetch) {
      currentPrefetch = total;
      const indicator = document.getElementById('buffer-indicator');
      indicator.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('div');
        dot.className = 'buf-dot';
        indicator.appendChild(dot);
      }
      // Keep header input in sync with server-reported prefetch
      const inp = document.getElementById('review-prefetch');
      if (inp && inp !== document.activeElement) inp.value = total;
    }
    document.querySelectorAll('.buf-dot').forEach((dot, i) => {
      dot.classList.toggle('ready', i < buffered);
    });
  }

  let _prefetchTimer = null;
  function setPrefetch(val) {
    clearTimeout(_prefetchTimer);
    _prefetchTimer = setTimeout(async () => {
      const n = parseInt(val);
      if (!n || n < 1) return;
      await fetch('/api/set-prefetch', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prefetch: n}),
      });
    }, 400);  // debounce: wait for user to stop typing
  }

  function showLoading(data) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    document.getElementById('overlay-title').textContent = 'Processing...';
    const sub = data.total > 0
      ? `Image ${data.idx} of ${data.total}`
      : 'Analysing images';
    document.getElementById('overlay-sub').textContent = sub;
    overlay.querySelector('.spinner').style.display = '';
    updateBuffer(data.buffered || 0, data.prefetch);
    uiReady = false;
    deciding = false;
  }

  function showImage(data) {
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('img-orig').src = 'data:image/jpeg;base64,' + data.orig_b64;
    document.getElementById('img-crop').src = 'data:image/jpeg;base64,' + data.crop_b64;
    document.getElementById('filename').textContent = data.filename;
    document.getElementById('progress').textContent = `${data.idx} / ${data.total}`;
    const pct = data.total > 0 ? ((data.idx - 1) / data.total * 100) : 0;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('panel-orig').classList.remove('selected');
    document.getElementById('panel-crop').classList.remove('selected');
    updateBuffer(data.buffered || 0, data.prefetch);
    uiReady = true;
    deciding = false;
  }

  function showDone(data) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    overlay.querySelector('.spinner').style.display = 'none';
    document.getElementById('overlay-title').textContent = 'All done';
    document.getElementById('overlay-sub').textContent = '';
    document.getElementById('progress-bar').style.width = '100%';
    uiReady = false;

    // Clear any previous stats/button
    overlay.querySelectorAll('#stats, .btn-secondary').forEach(el => el.remove());

    const stats = document.createElement('div');
    stats.id = 'stats';
    stats.innerHTML = `
      <div>Crops applied: <span>${data.accepted}</span></div>
      <div>Skipped: <span>${data.rejected}</span></div>
      <div>Already reviewed / no person: <span>${data.skipped}</span></div>
    `;
    overlay.appendChild(stats);

    const btn = document.createElement('button');
    btn.textContent = 'Process another folder';
    btn.className = 'btn-secondary';
    btn.onclick = showPicker;
    overlay.appendChild(btn);
  }

  async function decide(choice) {
    if (!uiReady || deciding) return;
    deciding = true;

    document.getElementById('panel-orig').classList.toggle('selected', choice === 'skip');
    document.getElementById('panel-crop').classList.toggle('selected', choice === 'crop');

    await fetch('/api/decide', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({choice}),
    });

    uiReady = false;
    setTimeout(poll, 100);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === '1') decide('skip');
    if (e.key === '2') decide('crop');
  });

  // ── Entry point ────────────────────────────────────────────

  if (INITIAL_PATH) {
    document.getElementById('screen-picker').classList.add('hidden');
    startWithPath(INITIAL_PATH);
  }
  // Otherwise the picker screen is visible and waiting for user interaction
</script>
</body>
</html>
