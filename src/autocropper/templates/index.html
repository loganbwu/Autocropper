<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocropper Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Folder picker screen -->
<div id="screen-picker">
  <div id="picker-title">Autocropper</div>
  <div id="picker-sub">Select a folder of CR3 files to review</div>
  <button id="btn-pick" onclick="pickFolder()">Select Folder</button>
  <div id="picker-error"></div>
</div>

<!-- Review UI -->
<div id="header">
  <div id="filename"></div>
  <div id="buffer-control">
    <span class="buffer-label">Buffer:</span>
    <span id="buffer-ready">0</span><span class="buffer-sep">/</span><input id="review-prefetch" type="number" min="{{ prefetch_min }}" max="{{ prefetch_max }}"
           value="{{ prefetch_default }}" title="Buffer size" oninput="setPrefetch(this.value)">
  </div>
  <div id="margin-control">
    <span class="buffer-label">Margin:</span>
    <input id="review-margin" type="number" min="{{ margin_min }}" max="{{ margin_max }}"
           value="{{ margin_default }}" title="Crop margin %" oninput="setMargin(this.value)">
    %
  </div>
  <div id="ml-control">
    <label id="ml-file-label" for="ml-file" title="Upload training dataset (.pkl)">dataset</label>
    <input id="ml-file" type="file" accept=".pkl" onchange="uploadDataset(this)">
    <span id="ml-status"></span>
    <button id="ml-toggle" title="Enable ML crop mode" onclick="toggleMlMode()" disabled></button>
    <label id="ml-label" for="ml-toggle" onclick="toggleMlMode()">ML</label>
  </div>
  <span id="ml-badge">ML</span>
  <div id="progress"></div>
</div>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<div id="panels">
  <div class="panel" id="panel-orig">
    <img id="img-orig" src="" alt="">
    <div class="key-hint"><span class="key-badge">1</span> Keep original</div>
  </div>
  <div class="panel" id="panel-crop">
    <canvas id="img-crop"></canvas>
    <div class="key-hint"><span class="key-badge">2</span> <span id="crop-hint-text">Apply crop</span></div>
  </div>
  <div id="overlay">
    <div class="spinner"></div>
    <div id="overlay-title">Loading...</div>
    <div id="overlay-sub"></div>
    <div id="overlay-progress-wrap" style="display:none">
      <div id="overlay-progress-bar"></div>
    </div>
  </div>
</div>

<script>
  const INITIAL_PATH = {{ initial_path | tojson }};

  let uiReady = false;
  let deciding = false;
  let currentPrefetch = 0;  // rebuilt from first state response
  let _es = null;

  function connectSSE() {
    if (_es) { _es.close(); _es = null; }
    _es = new EventSource('/api/events');
    _es.onmessage = (e) => {
      try { handleState(JSON.parse(e.data)); } catch (_) {}
    };
    _es.onerror = () => {
      // EventSource reconnects automatically; nothing to do here.
    };
  }

  function handleState(data) {
    if (data.status === 'error') {
      showPicker();
      document.getElementById('picker-error').textContent = data.message;
      return;
    }

    syncMlUi(data);

    if (data.status === 'starting') { showStarting(data.stage, data.progress); return; }
    if (data.status === 'done')     { showDone(data); return; }
    if (data.status === 'loading')  { showLoading(data); return; }
    if (data.status === 'ready') {
      if (data.filename === _currentFilename) {
        // Same image — buffer update or heartbeat. Refresh count; do not re-render.
        updateBuffer(data.buffered || 0, data.prefetch);
        return;
      }
      showImage(data);
      return;
    }
  }

  // ── Folder picker ──────────────────────────────────────────

  async function pickFolder() {
    document.getElementById('btn-pick').disabled = true;
    document.getElementById('picker-error').textContent = '';

    const res = await fetch('/api/pick-folder');
    const data = await res.json();

    if (!data.path) {
      // User cancelled the dialog
      document.getElementById('btn-pick').disabled = false;
      return;
    }

    await startWithPath(data.path);
  }

  async function startWithPath(path) {
    document.getElementById('btn-pick').disabled = true;
    document.getElementById('picker-sub').textContent = 'Loading...';
    document.getElementById('picker-error').textContent = '';

    await fetch('/api/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path}),
    });

    document.getElementById('screen-picker').classList.add('hidden');
    connectSSE();
  }

  function showPicker() {
    if (_es) { _es.close(); _es = null; }
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('screen-picker').classList.remove('hidden');
    document.getElementById('btn-pick').disabled = false;
    document.getElementById('picker-sub').textContent = 'Select a folder of CR3 files to review';
    document.getElementById('picker-error').textContent = '';
    uiReady = false;
    deciding = false;
  }

  function showStarting(stage, progress) {
    _nextPrecomputed = null;
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    overlay.querySelector('.spinner').style.display = '';
    document.getElementById('overlay-title').textContent = 'Starting...';
    document.getElementById('overlay-sub').textContent = stage || '';
    const wrap = document.getElementById('overlay-progress-wrap');
    const bar  = document.getElementById('overlay-progress-bar');
    if (progress != null) {
      wrap.style.display = '';
      bar.style.width = (progress * 100).toFixed(1) + '%';
    } else {
      wrap.style.display = 'none';
      bar.style.width = '0%';
    }
    uiReady = false;
    deciding = false;
  }

  function updateBuffer(buffered, total) {
    if (total !== undefined && total !== currentPrefetch) {
      currentPrefetch = total;
      const inp = document.getElementById('review-prefetch');
      if (inp && inp !== document.activeElement) inp.value = total;
    }
    document.getElementById('buffer-ready').textContent = buffered;
  }

  let _prefetchTimer = null;
  function setPrefetch(val) {
    clearTimeout(_prefetchTimer);
    _prefetchTimer = setTimeout(async () => {
      let n = parseInt(val);
      if (!n || isNaN(n)) return;
      n = Math.max({{ prefetch_min }}, Math.min({{ prefetch_max }}, n));
      // Snap the input to the clamped value so it always matches the dots
      const inp = document.getElementById('review-prefetch');
      if (inp) inp.value = n;
      await fetch('/api/set-prefetch', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prefetch: n}),
      });
    }, 400);
  }

  let _marginTimer = null;
  function setMargin(val) {
    clearTimeout(_marginTimer);
    _marginTimer = setTimeout(async () => {
      let pct = parseFloat(val);
      if (isNaN(pct)) return;
      pct = Math.max({{ margin_min }}, Math.min({{ margin_max }}, pct));
      const inp = document.getElementById('review-margin');
      if (inp) inp.value = pct;
      const res = await fetch('/api/set-margin', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({margin: pct}),
      });
      const data = await res.json();
      if (data.crop_coords) {
        _applyCrop(data.crop_coords);
      }
    }, 400);
  }

  function showLoading(data) {
    _nextPrecomputed = null;
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    document.getElementById('overlay-title').textContent = 'Processing...';
    const analysed = Math.min((data.producer_idx != null ? data.producer_idx : data.idx) + 1, data.total);
    const sub = data.total > 0
      ? `Analysing ${analysed} of ${data.total}`
      : 'Analysing images';
    document.getElementById('overlay-sub').textContent = sub;
    overlay.querySelector('.spinner').style.display = '';
    updateBuffer(data.buffered || 0, data.prefetch);
    uiReady = false;
    deciding = false;
  }

  let _currentCropCoords = null;
  let _origSize = null;
  let _currentFilename = null;
  let _dragState = null;
  let _cropImage = null;   // decoded Image for direct canvas draws
  let _cropCtx = null;     // canvas 2D context for img-crop
  let _rafId = null;       // pending requestAnimationFrame for drag

  function _drawCrop(coords) {
    if (!_cropImage || !_cropCtx) return;
    const {x1, y1, x2, y2} = coords;
    const cw = Math.round(x2 - x1);
    const ch = Math.round(y2 - y1);
    const canvas = document.getElementById('img-crop');
    if (canvas.width !== cw || canvas.height !== ch) {
      canvas.width = cw;
      canvas.height = ch;
    }
    _cropCtx.drawImage(_cropImage, -Math.round(x1), -Math.round(y1));
  }

  function _applyCrop(coords) {
    _currentCropCoords = coords;
    _drawCrop(coords);
  }

  async function showImage(data) {
    _currentFilename = data.filename;
    const origSrc = 'data:image/jpeg;base64,' + data.orig_b64;

    await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        _cropImage = img;
        _origSize = {w: img.naturalWidth, h: img.naturalHeight};
        resolve();
      };
      img.src = origSrc;
    });

    if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
    _dragState = null;
    const canvas = document.getElementById('img-crop');
    canvas.width  = Math.round(data.crop_coords.x2 - data.crop_coords.x1);
    canvas.height = Math.round(data.crop_coords.y2 - data.crop_coords.y1);
    _cropCtx = canvas.getContext('2d');
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('img-orig').src = origSrc;
    _currentCropCoords = data.crop_coords;
    _cropCtx.drawImage(_cropImage, -Math.round(data.crop_coords.x1), -Math.round(data.crop_coords.y1));
    document.getElementById('filename').textContent = data.filename;
    document.getElementById('progress').textContent = `${data.idx} / ${data.total}`;
    const pct = data.total > 0 ? ((data.idx - 1) / data.total * 100) : 0;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('panel-orig').classList.remove('selected');
    document.getElementById('panel-crop').classList.remove('selected');
    updateBuffer(data.buffered || 0, data.prefetch);
    document.getElementById('ml-badge').style.display = data.ml_crop ? '' : 'none';
    document.getElementById('crop-hint-text').textContent = data.ml_crop ? 'Apply ML crop' : 'Apply margin crop';
    syncMlUi(data);
    uiReady = true;
    deciding = false;
  }

  // ── ML crop controls ────────────────────────────────────────

  let _mlMode = false;
  let _mlDatasetLoaded = false;
  let _mlModelsReady = false;

  function syncMlUi(data) {
    if (!('ml_dataset_loaded' in data || 'ml_models_ready' in data)) return;

    _mlMode = !!data.ml_mode;
    _mlDatasetLoaded = !!data.ml_dataset_loaded;
    _mlModelsReady = !!data.ml_models_ready;

    const toggle = document.getElementById('ml-toggle');
    const marginCtrl = document.getElementById('margin-control');
    const fileLabel = document.getElementById('ml-file-label');
    const status = document.getElementById('ml-status');

    toggle.disabled = !(_mlDatasetLoaded && _mlModelsReady);
    toggle.classList.toggle('on', _mlMode);
    marginCtrl.classList.toggle('ml-active', _mlMode);

    if (_mlDatasetLoaded) {
      const name = data.ml_dataset_name || 'dataset.pkl';
      fileLabel.textContent = name;
      fileLabel.title = name;
      if (data.ml_models_error) {
        status.textContent = 'model load failed';
        status.title = data.ml_models_error;
      } else if (!_mlModelsReady) {
        status.textContent = 'loading models...';
        status.title = '';
      } else if (!_mlMode) {
        status.textContent = data.ml_dataset_records ? `${data.ml_dataset_records} records` : '';
        status.title = '';
      } else {
        status.textContent = '';
        status.title = '';
      }
    } else {
      fileLabel.textContent = 'dataset';
      fileLabel.title = '';
      status.textContent = '';
      status.title = '';
    }
  }

  async function uploadDataset(input) {
    const file = input.files[0];
    if (!file) return;
    const status = document.getElementById('ml-status');
    status.textContent = 'uploading...';
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/ml-dataset', { method: 'POST', body: form });
      const data = await res.json();
      if (data.error) {
        status.textContent = data.error;
      } else {
        status.textContent = `${data.records} records`;
        _mlDatasetLoaded = true;
        _mlModelsReady = data.ml_models_ready || false;
        const toggle = document.getElementById('ml-toggle');
        toggle.disabled = !_mlModelsReady;
        if (!_mlModelsReady) {
          status.textContent = `${data.records} records — loading models...`;
          // SSE will push an event when models finish loading; syncMlUi() updates the toggle.
        }
      }
    } catch (e) {
      status.textContent = 'upload failed';
    }
    input.value = '';
  }

  async function toggleMlMode() {
    if (!_mlDatasetLoaded || !_mlModelsReady) return;
    const newMode = !_mlMode;
    try {
      const res = await fetch('/api/ml-mode', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled: newMode}),
      });
      const data = await res.json();
      if (!data.error) {
        _mlMode = newMode;
        document.getElementById('ml-toggle').classList.toggle('on', _mlMode);
        document.getElementById('margin-control').classList.toggle('ml-active', _mlMode);
      }
    } catch (e) { /* ignore */ }
  }

  function showDone(data) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    overlay.querySelector('.spinner').style.display = 'none';
    document.getElementById('overlay-title').textContent = 'All done';
    document.getElementById('overlay-sub').textContent = '';
    document.getElementById('progress-bar').style.width = '100%';
    uiReady = false;

    // Clear any previous stats/button
    overlay.querySelectorAll('#stats, .btn-secondary').forEach(el => el.remove());

    const stats = document.createElement('div');
    stats.id = 'stats';
    const noPersonLine = data.no_person_skipped > 0
      ? `<div>No person detected: <span>${data.no_person_skipped}</span></div>` : '';
    const noopLine = data.noop_skipped > 0
      ? `<div>No-op crop skipped: <span>${data.noop_skipped}</span></div>` : '';
    const preSkipLine = data.pre_skipped > 0
      ? `<div>Already reviewed: <span>${data.pre_skipped}</span></div>` : '';
    stats.innerHTML = `
      <div>Crops applied: <span>${data.accepted}</span></div>
      <div>Kept original: <span>${data.rejected}</span></div>
      ${noPersonLine}${noopLine}${preSkipLine}
    `;
    overlay.appendChild(stats);

    const btn = document.createElement('button');
    btn.textContent = 'Process another folder';
    btn.className = 'btn-secondary';
    btn.onclick = showPicker;
    overlay.appendChild(btn);
  }

  async function decide(choice) {
    if (!uiReady || deciding) return;
    deciding = true;

    document.getElementById('panel-orig').classList.toggle('selected', choice === 'skip');
    document.getElementById('panel-crop').classList.toggle('selected', choice === 'crop');

    const coords = (choice === 'crop' && _currentCropCoords) ? _currentCropCoords : undefined;
    await fetch('/api/decide', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({choice, coords}),
    });

    uiReady = false;
    // No polling needed — SSE will push the next state when the consumer is ready.
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === '1') decide('skip');
    if (e.key === '2') decide('crop');
  });

  // ── Crop drag ──────────────────────────────────────────────

  document.getElementById('img-crop').addEventListener('mousedown', (e) => {
    if (!uiReady || !_currentCropCoords || !_origSize) return;
    e.preventDefault();
    _dragState = { startX: e.clientX, startY: e.clientY, base: {..._currentCropCoords} };
    document.getElementById('img-crop').style.cursor = 'grabbing';
  });

  document.addEventListener('mousemove', (e) => {
    if (!_dragState) return;
    const {x1, y1, x2, y2} = _dragState.base;
    const cw = x2 - x1, ch = y2 - y1;
    const cropEl = document.getElementById('img-crop');
    const scale = cw / cropEl.clientWidth;
    let nx1 = x1 - (e.clientX - _dragState.startX) * scale;
    let ny1 = y1 - (e.clientY - _dragState.startY) * scale;
    nx1 = Math.max(0, Math.min(_origSize.w - cw, nx1));
    ny1 = Math.max(0, Math.min(_origSize.h - ch, ny1));
    _currentCropCoords = {x1: nx1, y1: ny1, x2: nx1 + cw, y2: ny1 + ch};
    if (!_rafId) {
      _rafId = requestAnimationFrame(() => {
        _rafId = null;
        const c = _currentCropCoords;
        _cropCtx.clearRect(0, 0, cropEl.width, cropEl.height);
        _cropCtx.drawImage(_cropImage, -Math.round(c.x1), -Math.round(c.y1));
      });
    }
  });

  document.addEventListener('mouseup', () => {
    if (!_dragState) return;
    _dragState = null;
    document.getElementById('img-crop').style.cursor = '';
  });

  // ── Entry point ────────────────────────────────────────────

  if (INITIAL_PATH) {
    document.getElementById('screen-picker').classList.add('hidden');
    startWithPath(INITIAL_PATH);
  } else {
    // No initial path — open SSE so the UI can react to model-ready events while
    // sitting on the picker screen (e.g. the ML toggle becomes enabled).
    connectSSE();
  }
</script>
</body>
</html>
