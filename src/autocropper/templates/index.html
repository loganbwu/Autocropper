<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocropper Review</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    #filename { font-weight: 600; color: #fff; }
    #progress { color: #888; }

    #progress-bar-wrap {
      flex: 0 0 auto;
      height: 3px;
      background: #333;
    }
    #progress-bar {
      height: 100%;
      background: #4a9eff;
      width: 0%;
      transition: width 0.3s ease;
    }

    #panels {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }

    .panel {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.1s;
    }

    .panel:first-child { border-right: 1px solid #333; }

    .panel:hover { background: #1a1a1a; }

    .panel.selected {
      background: #1a2a1a;
      outline: 2px solid #5a9;
      outline-offset: -2px;
    }

    .panel img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .panel-label {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      white-space: nowrap;
    }

    .key-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: #aaa;
      pointer-events: none;
    }

    .key-badge {
      display: inline-block;
      background: #444;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(17,17,17,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }

    #overlay.hidden { display: none; }

    #overlay-title {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
    }

    #overlay-sub {
      font-size: 15px;
      color: #888;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #333;
      border-top-color: #4a9eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #stats {
      font-size: 14px;
      color: #888;
      text-align: center;
      line-height: 1.8;
    }

    #stats span { color: #fff; font-weight: 600; }
  </style>
</head>
<body>

<div id="header">
  <div id="filename">Loading...</div>
  <div id="progress"></div>
</div>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<div id="panels">
  <div class="panel" id="panel-orig" onclick="decide('skip')">
    <div class="panel-label">Original</div>
    <img id="img-orig" src="" alt="">
    <div class="key-hint"><span class="key-badge">1</span> Keep original</div>
  </div>
  <div class="panel" id="panel-crop" onclick="decide('crop')">
    <div class="panel-label">AI Crop</div>
    <img id="img-crop" src="" alt="">
    <div class="key-hint"><span class="key-badge">2</span> Apply crop</div>
  </div>
</div>

<div id="overlay">
  <div class="spinner"></div>
  <div id="overlay-title">Loading models...</div>
  <div id="overlay-sub"></div>
</div>

<script>
  let uiReady = false;
  let deciding = false;

  async function poll() {
    try {
      const res = await fetch('/api/state');
      const data = await res.json();

      if (data.status === 'done') {
        showDone(data);
        return;
      }

      if (data.status === 'loading') {
        showLoading(data);
        setTimeout(poll, 600);
        return;
      }

      // ready
      showImage(data);
      setTimeout(poll, 2000); // keep polling in case of stale state
    } catch (e) {
      setTimeout(poll, 1000);
    }
  }

  function showLoading(data) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    document.getElementById('overlay-title').textContent = 'Processing...';
    const sub = data.total > 0
      ? `Image ${data.idx} of ${data.total}`
      : 'Analysing images';
    document.getElementById('overlay-sub').textContent = sub;
    overlay.querySelector('.spinner').style.display = '';
    uiReady = false;
    deciding = false;
  }

  function showImage(data) {
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('img-orig').src = 'data:image/jpeg;base64,' + data.orig_b64;
    document.getElementById('img-crop').src = 'data:image/jpeg;base64,' + data.crop_b64;
    document.getElementById('filename').textContent = data.filename;
    document.getElementById('progress').textContent = `${data.idx} / ${data.total}`;
    const pct = data.total > 0 ? ((data.idx - 1) / data.total * 100) : 0;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('panel-orig').classList.remove('selected');
    document.getElementById('panel-crop').classList.remove('selected');
    uiReady = true;
    deciding = false;
  }

  function showDone(data) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    overlay.querySelector('.spinner').style.display = 'none';
    document.getElementById('overlay-title').textContent = 'All done';
    document.getElementById('overlay-sub').innerHTML = '';
    const stats = document.createElement('div');
    stats.id = 'stats';
    stats.innerHTML = `
      <div>Crops applied: <span>${data.accepted}</span></div>
      <div>Skipped: <span>${data.rejected}</span></div>
      <div>Already cropped / no person: <span>${data.skipped}</span></div>
    `;
    overlay.appendChild(stats);
    uiReady = false;
    document.getElementById('progress-bar').style.width = '100%';
  }

  async function decide(choice) {
    if (!uiReady || deciding) return;
    deciding = true;

    document.getElementById('panel-orig').classList.toggle('selected', choice === 'skip');
    document.getElementById('panel-crop').classList.toggle('selected', choice === 'crop');

    await fetch('/api/decide', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({choice}),
    });

    uiReady = false;
    setTimeout(poll, 100);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === '1') decide('skip');
    if (e.key === '2') decide('crop');
  });

  poll();
</script>
</body>
</html>
