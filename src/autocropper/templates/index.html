<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocropper Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Folder picker screen -->
<div id="screen-picker">
  <div id="picker-title">Autocropper</div>
  <div id="picker-sub">Select a folder of CR3 files to review</div>
  <button id="btn-pick" onclick="pickFolder()">Select Folder</button>
  <div id="picker-error"></div>
</div>

<!-- Review UI -->
<div id="header">
  <div id="filename"></div>
  <div id="buffer-control">
    <div id="buffer-indicator"></div>
    <input id="review-prefetch" type="number" min="{{ prefetch_min }}" max="{{ prefetch_max }}"
           value="{{ prefetch_default }}" title="Buffer size" oninput="setPrefetch(this.value)">
  </div>
  <div id="margin-control">
    margin
    <input id="review-margin" type="number" min="{{ margin_min }}" max="{{ margin_max }}"
           value="{{ margin_default }}" title="Crop margin %" oninput="setMargin(this.value)">
    %
  </div>
  <div id="ml-control">
    <label id="ml-file-label" for="ml-file" title="Upload training dataset (.pkl)">dataset</label>
    <input id="ml-file" type="file" accept=".pkl" onchange="uploadDataset(this)">
    <span id="ml-status"></span>
    <button id="ml-toggle" title="Enable ML crop mode" onclick="toggleMlMode()" disabled></button>
    <label id="ml-label" for="ml-toggle" onclick="toggleMlMode()">ML</label>
  </div>
  <span id="ml-badge">ML</span>
  <div id="progress"></div>
</div>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<div id="panels">
  <div class="panel" id="panel-orig" onclick="decide('skip')">
    <img id="img-orig" src="" alt="">
    <div class="key-hint"><span class="key-badge">1</span> Keep original</div>
  </div>
  <div class="panel" id="panel-crop" onclick="decide('crop')">
    <img id="img-crop" src="" alt="">
    <div class="key-hint"><span class="key-badge">2</span> Apply crop</div>
  </div>
</div>

<div id="overlay">
  <div class="spinner"></div>
  <div id="overlay-title">Loading...</div>
  <div id="overlay-sub"></div>
  <div id="overlay-progress-wrap" style="display:none">
    <div id="overlay-progress-bar"></div>
  </div>
</div>

<script>
  const INITIAL_PATH = {{ initial_path | tojson }};

  let uiReady = false;
  let deciding = false;
  let currentPrefetch = 0;  // rebuilt from first state response
  let _pollTimer = null;

  function schedulePoll(delay) {
    clearTimeout(_pollTimer);
    _pollTimer = setTimeout(poll, delay);
  }

  // ── Folder picker ──────────────────────────────────────────

  async function pickFolder() {
    document.getElementById('btn-pick').disabled = true;
    document.getElementById('picker-error').textContent = '';

    const res = await fetch('/api/pick-folder');
    const data = await res.json();

    if (!data.path) {
      // User cancelled the dialog
      document.getElementById('btn-pick').disabled = false;
      return;
    }

    await startWithPath(data.path);
  }

  async function startWithPath(path) {
    document.getElementById('btn-pick').disabled = true;
    document.getElementById('picker-sub').textContent = 'Loading...';
    document.getElementById('picker-error').textContent = '';

    await fetch('/api/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path}),
    });

    document.getElementById('screen-picker').classList.add('hidden');
    poll();
  }

  function showPicker() {
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('screen-picker').classList.remove('hidden');
    document.getElementById('btn-pick').disabled = false;
    document.getElementById('picker-sub').textContent = 'Select a folder of CR3 files to review';
    document.getElementById('picker-error').textContent = '';
    uiReady = false;
    deciding = false;
  }

  // ── Review polling ─────────────────────────────────────────

  async function poll() {
    try {
      const res = await fetch('/api/state');
      const data = await res.json();

      if (data.status === 'error') {
        showPicker();
        document.getElementById('picker-error').textContent = data.message;
        return;
      }

      syncMlUi(data);

      if (data.status === 'starting') {
        showStarting(data.stage, data.progress);
        schedulePoll(data.progress != null ? 250 : 600);
        return;
      }

      if (data.status === 'done') {
        showDone(data);
        return;
      }

      if (data.status === 'loading') {
        showLoading(data);
        schedulePoll(600);
        return;
      }

      // ready
      showImage(data);
      schedulePoll(2000);
    } catch (e) {
      schedulePoll(1000);
    }
  }

  function showStarting(stage, progress) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    overlay.querySelector('.spinner').style.display = '';
    document.getElementById('overlay-title').textContent = 'Starting...';
    document.getElementById('overlay-sub').textContent = stage || '';
    const wrap = document.getElementById('overlay-progress-wrap');
    const bar  = document.getElementById('overlay-progress-bar');
    if (progress != null) {
      wrap.style.display = '';
      bar.style.width = (progress * 100).toFixed(1) + '%';
    } else {
      wrap.style.display = 'none';
      bar.style.width = '0%';
    }
    uiReady = false;
    deciding = false;
  }

  function updateBuffer(buffered, total) {
    if (total !== undefined && total !== currentPrefetch) {
      currentPrefetch = total;
      const indicator = document.getElementById('buffer-indicator');
      indicator.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('div');
        dot.className = 'buf-dot';
        indicator.appendChild(dot);
      }
      // Keep header input in sync with server-reported prefetch
      const inp = document.getElementById('review-prefetch');
      if (inp && inp !== document.activeElement) inp.value = total;
    }
    document.querySelectorAll('.buf-dot').forEach((dot, i) => {
      dot.classList.toggle('ready', i < buffered);
    });
  }

  let _prefetchTimer = null;
  function setPrefetch(val) {
    clearTimeout(_prefetchTimer);
    _prefetchTimer = setTimeout(async () => {
      let n = parseInt(val);
      if (!n || isNaN(n)) return;
      n = Math.max({{ prefetch_min }}, Math.min({{ prefetch_max }}, n));
      // Snap the input to the clamped value so it always matches the dots
      const inp = document.getElementById('review-prefetch');
      if (inp) inp.value = n;
      await fetch('/api/set-prefetch', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prefetch: n}),
      });
    }, 400);
  }

  let _marginTimer = null;
  function setMargin(val) {
    clearTimeout(_marginTimer);
    _marginTimer = setTimeout(async () => {
      let pct = parseFloat(val);
      if (isNaN(pct)) return;
      pct = Math.max({{ margin_min }}, Math.min({{ margin_max }}, pct));
      const inp = document.getElementById('review-margin');
      if (inp) inp.value = pct;
      const res = await fetch('/api/set-margin', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({margin: pct}),
      });
      const data = await res.json();
      if (data.crop_b64) {
        document.getElementById('img-crop').src = 'data:image/jpeg;base64,' + data.crop_b64;
      }
    }, 400);
  }

  function showLoading(data) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    document.getElementById('overlay-title').textContent = 'Processing...';
    const analysed = data.producer_idx != null ? data.producer_idx : data.idx;
    const sub = data.total > 0
      ? `Analysing ${analysed} of ${data.total}`
      : 'Analysing images';
    document.getElementById('overlay-sub').textContent = sub;
    overlay.querySelector('.spinner').style.display = '';
    updateBuffer(data.buffered || 0, data.prefetch);
    uiReady = false;
    deciding = false;
  }

  function showImage(data) {
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('img-orig').src = 'data:image/jpeg;base64,' + data.orig_b64;
    document.getElementById('img-crop').src = 'data:image/jpeg;base64,' + data.crop_b64;
    document.getElementById('filename').textContent = data.filename;
    document.getElementById('progress').textContent = `${data.idx} / ${data.total}`;
    const pct = data.total > 0 ? ((data.idx - 1) / data.total * 100) : 0;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('panel-orig').classList.remove('selected');
    document.getElementById('panel-crop').classList.remove('selected');
    updateBuffer(data.buffered || 0, data.prefetch);
    // Show ML badge on crop panel when result came from ML mode
    document.getElementById('ml-badge').style.display = data.ml_crop ? '' : 'none';
    // Sync toggle state with server
    syncMlUi(data);
    uiReady = true;
    deciding = false;
  }

  // ── ML crop controls ────────────────────────────────────────

  let _mlMode = false;
  let _mlDatasetLoaded = false;
  let _mlModelsReady = false;

  function syncMlUi(data) {
    if (!('ml_dataset_loaded' in data || 'ml_models_ready' in data)) return;

    _mlMode = !!data.ml_mode;
    _mlDatasetLoaded = !!data.ml_dataset_loaded;
    _mlModelsReady = !!data.ml_models_ready;

    const toggle = document.getElementById('ml-toggle');
    const marginCtrl = document.getElementById('margin-control');
    const fileLabel = document.getElementById('ml-file-label');
    const status = document.getElementById('ml-status');

    toggle.disabled = !(_mlDatasetLoaded && _mlModelsReady);
    toggle.classList.toggle('on', _mlMode);
    marginCtrl.classList.toggle('ml-active', _mlMode);

    if (_mlDatasetLoaded) {
      const name = data.ml_dataset_name || 'dataset.pkl';
      fileLabel.textContent = name;
      fileLabel.title = name;
      if (data.ml_models_error) {
        status.textContent = 'model load failed';
        status.title = data.ml_models_error;
      } else if (!_mlModelsReady) {
        status.textContent = 'loading models...';
        status.title = '';
      } else if (!_mlMode) {
        status.textContent = data.ml_dataset_records ? `${data.ml_dataset_records} records` : '';
        status.title = '';
      } else {
        status.textContent = '';
        status.title = '';
      }
    } else {
      fileLabel.textContent = 'dataset';
      fileLabel.title = '';
      status.textContent = '';
      status.title = '';
    }
  }

  async function uploadDataset(input) {
    const file = input.files[0];
    if (!file) return;
    const status = document.getElementById('ml-status');
    status.textContent = 'uploading...';
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/ml-dataset', { method: 'POST', body: form });
      const data = await res.json();
      if (data.error) {
        status.textContent = data.error;
      } else {
        status.textContent = `${data.records} records`;
        _mlDatasetLoaded = true;
        _mlModelsReady = data.ml_models_ready || false;
        const toggle = document.getElementById('ml-toggle');
        toggle.disabled = !_mlModelsReady;
        if (!_mlModelsReady) {
          status.textContent = `${data.records} records — loading models...`;
          // Poll until ML models ready
          const pollModels = setInterval(async () => {
            const r = await fetch('/api/state');
            const d = await r.json();
            if (d.ml_models_ready) {
              clearInterval(pollModels);
              status.textContent = `${data.records} records`;
              toggle.disabled = false;
            }
          }, 2000);
        }
      }
    } catch (e) {
      status.textContent = 'upload failed';
    }
    input.value = '';
  }

  async function toggleMlMode() {
    if (!_mlDatasetLoaded || !_mlModelsReady) return;
    const newMode = !_mlMode;
    try {
      const res = await fetch('/api/ml-mode', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled: newMode}),
      });
      const data = await res.json();
      if (!data.error) {
        _mlMode = newMode;
        document.getElementById('ml-toggle').classList.toggle('on', _mlMode);
        document.getElementById('margin-control').classList.toggle('ml-active', _mlMode);
      }
    } catch (e) { /* ignore */ }
  }

  function showDone(data) {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    overlay.querySelector('.spinner').style.display = 'none';
    document.getElementById('overlay-title').textContent = 'All done';
    document.getElementById('overlay-sub').textContent = '';
    document.getElementById('progress-bar').style.width = '100%';
    uiReady = false;

    // Clear any previous stats/button
    overlay.querySelectorAll('#stats, .btn-secondary').forEach(el => el.remove());

    const stats = document.createElement('div');
    stats.id = 'stats';
    const autoSkipLine = data.auto_skipped > 0
      ? `<div>No person / no-op crop: <span>${data.auto_skipped}</span></div>` : '';
    const preSkipLine = data.pre_skipped > 0
      ? `<div>Already reviewed: <span>${data.pre_skipped}</span></div>` : '';
    stats.innerHTML = `
      <div>Crops applied: <span>${data.accepted}</span></div>
      <div>Kept original: <span>${data.rejected}</span></div>
      ${autoSkipLine}${preSkipLine}
    `;
    overlay.appendChild(stats);

    const btn = document.createElement('button');
    btn.textContent = 'Process another folder';
    btn.className = 'btn-secondary';
    btn.onclick = showPicker;
    overlay.appendChild(btn);
  }

  async function decide(choice) {
    if (!uiReady || deciding) return;
    deciding = true;

    document.getElementById('panel-orig').classList.toggle('selected', choice === 'skip');
    document.getElementById('panel-crop').classList.toggle('selected', choice === 'crop');

    await fetch('/api/decide', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({choice}),
    });

    uiReady = false;
    schedulePoll(100);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === '1') decide('skip');
    if (e.key === '2') decide('crop');
  });

  // ── Entry point ────────────────────────────────────────────

  if (INITIAL_PATH) {
    document.getElementById('screen-picker').classList.add('hidden');
    startWithPath(INITIAL_PATH);
  }
  // Otherwise the picker screen is visible and waiting for user interaction
</script>
</body>
</html>
