[project]
name = "autocropper"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Logan Wu", email = "loganbwu@gmail.com" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.50.0",
    "scipy>=1.10.0",
    "pillow>=12.0.0",
    "tqdm>=4.67.1",
    "torchvision>=0.25.0",
    "flask>=3.1.3",
    "rawpy>=0.27.0",
    "accelerate>=1.13.0",
    "ultralytics>=8.0",
]
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
autocrop = "autocropper.main:main"
autocropper = "autocropper.web:web_main"
build-training-dataset = "autocropper.build_training_dataset:main"
optimize-weights = "autocropper.optimize_weights:main"
diagnostic-masks = "autocropper.diagnostic_masks:main"
diagnostic-knn = "autocropper.diagnostic_knn:main"
diagnostic-yaw = "autocropper.diagnostic_yaw:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/autocropper"]
